 model:
  base_learning_rate: 2.0e-06
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    # first_stage_key: key
    audio_size: 128
    channels: 1
    monitor: val/loss_simple_ema
    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        audio_size: 256
        in_channels: 1
        out_channels: 1
        model_channels: 256
        attention_resolutions:
        - 16
        - 8
        - 4
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 8
        num_head_channels: 32
    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        embed_dim: 1
        n_embed: 8192
        ddconfig:
          double_z: false
          z_channels: 1
          resolution: 256
          in_channels: 1
          out_ch: 1
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: ldm.modules.encoders.modules.SpeakerEmbedder
      params:
        embed_dim: 256
 data:
  target: main.AudioDataModule
  params:
    root_dir: "./" 
    batch_size: 128
    num_workers: 16
    val_ratio: 0.2
    wrap: false
    train:  
      target: ldm.data.audionet.SpeakerTrainDataset
      params:
        root_dir: "./"
        speaker_id_pattern: 'spk(\d+)' 
        min_emb_size: 256
    validation:
      target: ldm.data.audionet.SpeakerValDataset
      params:
        root_dir: "./"

 lightning:
  callbacks:
    audio_logger:
      target: main.AudioLogger
      params:
        batch_frequency: 100
        max_audio: 8
        increase_log_steps: False

  trainer:
    benchmark: True